name: Bug report
description: Something converted wrong, crashed, or lost data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real password, a real `.bcup` file, or a real `.kdbx` file here.**
        If you found a security problem, do not use this form — see
        [SECURITY.md](https://github.com/dizitart/bcup2kdbx/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Ideally: a *synthetic* vault you built for this report. Describe the entries,
        groups and field types involved — e.g. "a credit_card entry with a custom field
        named `URL` inside a nested group".
      placeholder: |
        1. In Buttercup, create ...
        2. Export the vault to a .bcup file
        3. Run: node convert.js vault.bcup out.kdbx
        4. Open out.kdbx in KeePassXC — the ... field is missing
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The full terminal output, including any verification failures.
      render: text

  - type: input
    id: version
    attributes:
      label: bcup2kdbx version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: input
    id: reader
    attributes:
      label: Which KeePass client did you open the output with?
      placeholder: KeePassXC 2.7.9

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have not included any real credentials, vault files or passwords.
          required: true
        - label: I am using a supported Node version (20 or later).
          required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  package:
    name: Verify publishable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Catches a `files` list that forgets a source file, which would ship a
      # broken tarball that CI would otherwise never notice.
      - name: Pack and smoke-test the tarball
        shell: bash
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && tar -xzf dizitart-bcup2kdbx-*.tgz -C /tmp/smoke
          cd /tmp/smoke/package
          npm install --omit=dev --silent
          node convert.js 2>&1 | grep -q 'Usage: bcup2kdbx'
          echo "Packed CLI starts and prints usage."

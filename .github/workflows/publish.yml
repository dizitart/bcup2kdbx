name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@dizitart/bcup2kdbx
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; the bundled npm may be older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Check tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      # No NODE_AUTH_TOKEN: authentication is OIDC via the trusted publisher
      # configured at npmjs.com. Provenance is attached automatically.
      - name: Publish
        run: npm publish
